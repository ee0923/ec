name: Build Escrcpy

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        options: [all, linux, mac, win]
        default: all

permissions:
  contents: read

concurrency:
  group: escrcpy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  HUSKY: '0'
  DO_NOT_TRACK: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  prepare:
    name: Lock dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require matching privacy customization
        env:
          ESCRCPY_CUSTOMIZE_SCRIPT: ${{ secrets.ESCRCPY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh --check-secret
      - id: targets
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
        run: python scripts/matrix.py "$BUILD_TARGET" >> "$GITHUB_OUTPUT"
      - run: python scripts/checkout-source.py
      - name: Apply and verify privacy patch before dependency scripts
        env:
          ESCRCPY_CUSTOMIZE_SCRIPT: ${{ secrets.ESCRCPY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.29.2'
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
      - name: Resolve one dependency graph for every platform
        working-directory: source
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escrcpy-dependency-lock
          path: source/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.id }}
    permissions:
      contents: write
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    concurrency:
      group: escrcpy-${{ github.ref }}-${{ matrix.id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/checkout-source.py
      - name: Apply and verify privacy patch before dependency scripts
        env:
          ESCRCPY_CUSTOMIZE_SCRIPT: ${{ secrets.ESCRCPY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.29.2'
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escrcpy-dependency-lock
          path: source
      - name: Install Flatpak toolchain and matching runtime
        if: matrix.platform == 'linux'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libudev-dev
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          arch=x86_64
          if [[ "$BUILD_ARCH" == arm64 ]]; then arch=aarch64; fi
          flatpak --user install --arch="$arch" -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Install dependencies from the shared lock
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Verify privacy source after dependency scripts
        env:
          ESCRCPY_CUSTOMIZE_SCRIPT: ${{ secrets.ESCRCPY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh --verify
      - name: Build upstream workspace and native packages
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: python scripts/build.py "$BUILD_PLATFORM" "$BUILD_ARCH"
      - name: Verify privacy source before collecting packages
        env:
          ESCRCPY_CUSTOMIZE_SCRIPT: ${{ secrets.ESCRCPY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh --verify
      - name: Collect complete packages and provenance
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: python scripts/package.py "$BUILD_PLATFORM" "$BUILD_ARCH"
      - name: Publish this platform immediately
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_ID: ${{ matrix.id }}
        run: python scripts/publish-release.py "$PACKAGE_ID"
